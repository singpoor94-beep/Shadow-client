plugins {
    id 'java'
    id 'maven-publish'
    id 'fabric-loom' version '0.12-SNAPSHOT'
}

group = project.maven_group
version = project.mod_version
archivesBaseName = "${project.mod_id}-mc${project.minecraft_version}"

sourceCompatibility = targetCompatibility = JavaVersion.VERSION_17

// റൂട്ട് ഫോൾഡറിലുള്ള .java, .json ഫയലുകൾ നേരിട്ട് എടുക്കാൻ
sourceSets {
    main {
        java {
            srcDirs = ['.']
            include '*.java'
            include 'src/main/java/**/*.java'
        }
        resources {
            srcDirs = ['.']
            include '*.json'
            include 'assets/**'
            include 'src/main/resources/**'
        }
    }
}

repositories {
    mavenCentral()
    maven { name 'Fabric'; url 'https://maven.fabricmc.net/' }
    maven { name 'TerraformersMC'; url 'https://maven.terraformersmc.com/' }
}

dependencies {
    // Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Mods
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "com.terraformersmc:modmenu:${project.mod_menu_version}"

    // Code Quality
    compileOnly "org.jetbrains:annotations:${project.jetbrains_annotations_version}"
}

processResources {
    inputs.property 'id', project.mod_id
    inputs.property 'name', project.mod_name
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand(['id': project.mod_id, 'name': project.mod_name, 'version': project.version])
    }
}

java {
    withSourcesJar()
}
